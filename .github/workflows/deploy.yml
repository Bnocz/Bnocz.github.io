name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuild every 30 minutes so pages that fetch data at build time (e.g. /canucks/) stay fresh.
  # GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days without repo activity.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Only one deploy at a time; a newer run waits instead of racing an older one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5